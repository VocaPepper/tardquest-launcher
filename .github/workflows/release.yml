name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Read changelog for this release
        id: changelog
        shell: bash
        run: |
          # Emit the topmost "## <version>" section from CHANGELOG.md as the release body.
          body="$(awk '/^## /{c++; if (c>1) exit} c==1{print}' CHANGELOG.md)"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build & publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for signed updater artifacts (self-update).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          # "beta" is a title-only label; the app/build version stays numeric
          # so the Windows MSI/NSIS bundlers accept it.
          releaseName: "TQ Launcher ${{ github.ref_name }}-beta"
          releaseBody: ${{ steps.changelog.outputs.body }}
          # Published (not draft) and not a prerelease, so it resolves via
          # https://github.com/VocaPepper/tardquest-launcher/releases/latest/download/latest.json
          releaseDraft: false
          prerelease: false
